esphome:
  name: power-meter-4lines
  friendly_name: Power Meter 4 Lines
  includes:
    - power_meter_ads1115_4lines.h
  on_boot:
    - priority: 600
      then:
        - lambda: |-
            // Создаем объект и сохраняем его в глобальную C++ переменную,
            // которая объявлена в .h файле
            global_power_meter = new PowerMeter4Lines(
              id(ads_current),
              id(ads_voltage),
              50.0f, 20, 30.0f, 230.0f
            );
            global_power_meter->setup();
            App.register_component_(global_power_meter); 

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:

api:
  encryption:
    key: !secret api_key

ota:

i2c:
  sda: 21
  scl: 22
  scan: true
  id: bus_a

ads1115:
  - address: 0x48
    id: ads_current
    continuous_mode: true
    i2c_id: bus_a
  - address: 0x49
    id: ads_voltage
    continuous_mode: true
    i2c_id: bus_a

sensor:
  # === LINE 1 ===
  - platform: template
    name: "L1 Current"
    unit_of_measurement: "A"
    accuracy_decimals: 3
    lambda: "return global_power_meter ? global_power_meter->line1_current->state : NAN;"
  - platform: template
    name: "L1 Voltage"
    unit_of_measurement: "V"
    accuracy_decimals: 1
    lambda: "return global_power_meter ? global_power_meter->line1_voltage->state : NAN;"
  - platform: template
    name: "L1 Power Import"
    unit_of_measurement: "W"
