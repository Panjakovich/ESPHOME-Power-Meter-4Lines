    lambda: "return global_power_meter ? global_power_meter->line1_power_import->state : NAN;"
  - platform: template
    name: "L1 Power Export"
    unit_of_measurement: "W"
    accuracy_decimals: 1
    lambda: "return global_power_meter ? global_power_meter->line1_power_export->state : NAN;"
  - platform: template
    name: "L1 Energy Import"
    unit_of_measurement: "kWh"
    accuracy_decimals: 3
    device_class: energy
    state_class: total_increasing
    lambda: "return global_power_meter ? global_power_meter->line1_energy_import->state : NAN;"
